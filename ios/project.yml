# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` → NutriDose.xcodeproj
name: NutriDose
options:
  bundleIdPrefix: com.nutridose
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  NutriDose:
    type: application
    platform: iOS
    sources: [NutriDose]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nutridose.app
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: NutriDose/NutriDose.entitlements
    info:
      path: NutriDose/Info.plist
      properties:
        CFBundleDisplayName: NutriDose
        CFBundleDevelopmentRegion: tr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Paketli ürünlerin barkodunu okumak için kamera kullanılır. Görüntü cihazdan çıkmaz."
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        API_BASE_URL: $(API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.nutridose.auth
            CFBundleURLSchemes: [nutridose]
